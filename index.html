<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>天空小球：跨越险阻</title>
    <style>
      html, body, #app { height: 100%; margin: 0; }
      #hud {
        position: fixed; left: 12px; top: 12px; z-index: 10;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      }
      .panel { background: rgba(0,0,0,0.35); padding: 8px 10px; border-radius: 8px; }
      #centerHints { position: fixed; left: 50%; transform: translateX(-50%); bottom: 36px; z-index: 10; color: white; opacity: 0.9; }
      #centerHints .panel { text-align: center; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div class="panel">
        <div>时间: <span id="timer">0.00</span>s</div>
        <div>检查点: <span id="checkpoint">起点</span></div>
      </div>
    </div>
    <div id="centerHints">
      <div class="panel">WASD移动，空格跳跃，R重置到最近检查点</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
