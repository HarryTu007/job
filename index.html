<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天空小球冒险 - Sky Ball Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* UI覆盖层 */
        #gameUI {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* 顶部状态栏 */
        .status-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .status-icon {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* 生命值显示 */
        .lives {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .life {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .life.lost {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.8);
        }

        /* 控制提示 */
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            color: white;
            backdrop-filter: blur(10px);
        }

        .controls h3 {
            margin-bottom: 10px;
            color: #ffd700;
        }

        .control-item {
            margin: 5px 0;
            font-size: 14px;
        }

        .control-key {
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 4px;
            margin: 0 5px;
            font-weight: bold;
        }

        /* 开始屏幕 */
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.95) 0%, rgba(118, 75, 162, 0.95) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        #startScreen h1 {
            font-size: 60px;
            color: white;
            margin-bottom: 20px;
            text-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        #startScreen h2 {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 40px;
        }

        .start-button {
            padding: 20px 60px;
            font-size: 24px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            font-weight: bold;
            pointer-events: auto;
        }

        .start-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        /* 游戏结束屏幕 */
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #gameOverScreen h1 {
            font-size: 48px;
            color: #ff4444;
            margin-bottom: 20px;
        }

        #gameOverScreen .final-score {
            font-size: 32px;
            color: white;
            margin-bottom: 30px;
        }

        /* 胜利屏幕 */
        #winScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.95) 0%, rgba(255, 140, 0, 0.95) 100%);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #winScreen h1 {
            font-size: 60px;
            color: white;
            margin-bottom: 20px;
            text-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            animation: celebrate 1s ease-in-out infinite alternate;
        }

        #winScreen .final-score {
            font-size: 36px;
            color: white;
            margin-bottom: 30px;
        }

        .restart-button {
            padding: 15px 40px;
            font-size: 20px;
            background: white;
            color: #333;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.3s ease;
            font-weight: bold;
            pointer-events: auto;
        }

        .restart-button:hover {
            transform: scale(1.1);
        }

        /* 动画 */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes celebrate {
            from { transform: scale(1) rotate(-5deg); }
            to { transform: scale(1.1) rotate(5deg); }
        }

        /* 进度条 */
        .progress-bar {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #8bc34a);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 5px;
        }

        /* 粒子效果容器 */
        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>
    <!-- 游戏画布 -->
    <canvas id="gameCanvas"></canvas>
    
    <!-- 游戏UI层 -->
    <div id="gameUI">
        <!-- 状态栏 -->
        <div class="status-bar">
            <div class="status-item">
                <span class="status-icon">🏆</span>
                <span id="score">0</span>
            </div>
            <div class="status-item">
                <span class="status-icon">⭐</span>
                <span id="level">Level 1</span>
            </div>
            <div class="status-item">
                <span class="status-icon">⏱️</span>
                <span id="time">0:00</span>
            </div>
        </div>

        <!-- 生命值 -->
        <div class="lives" id="lives">
            <div class="life">❤️</div>
            <div class="life">❤️</div>
            <div class="life">❤️</div>
        </div>

        <!-- 控制提示 -->
        <div class="controls">
            <h3>控制方式</h3>
            <div class="control-item">
                <span class="control-key">W/↑</span> 向前
                <span class="control-key">S/↓</span> 向后
            </div>
            <div class="control-item">
                <span class="control-key">A/←</span> 向左
                <span class="control-key">D/→</span> 向右
            </div>
            <div class="control-item">
                <span class="control-key">空格</span> 跳跃
            </div>
            <div class="control-item">
                <span class="control-key">鼠标</span> 视角控制
            </div>
        </div>

        <!-- 进度条 -->
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <!-- 开始屏幕 -->
    <div id="startScreen">
        <h1>🌟 天空小球冒险 🌟</h1>
        <h2>穿越天空中的重重障碍，到达终点！</h2>
        <button class="start-button" onclick="startGame()">开始游戏</button>
    </div>

    <!-- 游戏结束屏幕 -->
    <div id="gameOverScreen">
        <h1>游戏结束</h1>
        <div class="final-score">最终得分: <span id="finalScore">0</span></div>
        <button class="restart-button" onclick="restartGame()">重新开始</button>
    </div>

    <!-- 胜利屏幕 -->
    <div id="winScreen">
        <h1>🎉 恭喜通关！🎉</h1>
        <div class="final-score">最终得分: <span id="winScore">0</span></div>
        <button class="restart-button" onclick="nextLevel()">下一关</button>
    </div>

    <!-- 粒子效果 -->
    <div id="particles"></div>

    <!-- Three.js库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- 游戏主脚本 -->
    <script src="game.js"></script>
</body>
</html>
