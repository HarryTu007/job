<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D天空小球冒险游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <div id="score">得分: <span id="scoreValue">0</span></div>
            <div id="lives">生命: <span id="livesValue">3</span></div>
            <div id="level">关卡: <span id="levelValue">1</span></div>
        </div>
        <div id="gameOver" class="hidden">
            <h2>游戏结束</h2>
            <p>最终得分: <span id="finalScore">0</span></p>
            <button id="restartBtn">重新开始</button>
        </div>
        <div id="startScreen">
            <h1>3D天空小球冒险</h1>
            <p>使用 WASD 或 方向键 控制小球</p>
            <p>避开障碍物，收集星星，到达终点！</p>
            <button id="startBtn">开始游戏</button>
        </div>
        <div id="instructions">
            <p>WASD 或 方向键: 移动 | 空格: 跳跃 | R: 重新开始</p>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
