<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天空小球冒险 - Sky Ball Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #gameUI {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        .ui-element {
            pointer-events: auto;
        }
        
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }
        
        #gameTitle {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        #startButton {
            padding: 15px 30px;
            font-size: 1.2em;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        #startButton:hover {
            transform: scale(1.1);
        }
        
        #gameHUD {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 1.2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            display: none;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            font-size: 1em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            display: none;
        }
        
        #gameOver {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }
        
        #gameOverTitle {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #ff6b6b;
        }
        
        #finalScore {
            font-size: 1.5em;
            margin-bottom: 20px;
        }
        
        #restartButton {
            padding: 12px 25px;
            font-size: 1.1em;
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            border: none;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        #restartButton:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="gameUI">
            <!-- 开始界面 -->
            <div id="startScreen" class="ui-element">
                <h1 id="gameTitle">天空小球冒险</h1>
                <p style="margin-bottom: 30px; font-size: 1.1em;">在天空中控制小球，跨越重重险阻！</p>
                <button id="startButton" class="ui-element">开始游戏</button>
            </div>
            
            <!-- 游戏HUD -->
            <div id="gameHUD" class="ui-element">
                <div>关卡: <span id="levelDisplay">1</span></div>
                <div>分数: <span id="scoreDisplay">0</span></div>
                <div>生命: <span id="livesDisplay">3</span></div>
            </div>
            
            <!-- 操作说明 -->
            <div id="instructions" class="ui-element">
                <p>使用 WASD 或 方向键 移动小球 | 空格键跳跃</p>
            </div>
            
            <!-- 游戏结束界面 -->
            <div id="gameOver" class="ui-element">
                <h2 id="gameOverTitle">游戏结束</h2>
                <p id="finalScore">最终分数: 0</p>
                <button id="restartButton" class="ui-element">重新开始</button>
            </div>
        </div>
    </div>
    
    <!-- Three.js 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.20.0/cannon.min.js"></script>
    
    <!-- 游戏脚本 -->
    <script src="js/audio.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
